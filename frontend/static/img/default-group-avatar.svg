<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 吉卜力风格：龙猫主题 -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 天空背景 -->
  <circle cx="50" cy="50" r="48" fill="url(#skyGrad)"/>
  
  <!-- 草地 -->
  <ellipse cx="50" cy="85" rx="40" ry="12" fill="#7CB342"/>
  
  <!-- 小龙猫左 -->
  <ellipse cx="35" cy="65" rx="12" ry="15" fill="#5D6D7E"/>
  <circle cx="35" cy="55" r="8" fill="#5D6D7E"/>
  <circle cx="33" cy="53" r="2" fill="#1a1a1a"/>
  <circle cx="37" cy="53" r="2" fill="#1a1a1a"/>
  
  <!-- 小龙猫右 -->
  <ellipse cx="65" cy="65" rx="12" ry="15" fill="#5D6D7E"/>
  <circle cx="65" cy="55" r="8" fill="#5D6D7E"/>
  <circle cx="63" cy="53" r="2" fill="#1a1a1a"/>
  <circle cx="67" cy="53" r="2" fill="#1a1a1a"/>
  
  <!-- 大龙猫在中间 -->
  <ellipse cx="50" cy="60" rx="18" ry="22" fill="#95A5A6"/>
  <circle cx="50" cy="45" r="12" fill="#95A5A6"/>
  <circle cx="46" cy="43" r="3" fill="#1a1a1a"/>
  <circle cx="54" cy="43" r="3" fill="#1a1a1a"/>
  <ellipse cx="50" cy="50" rx="6" ry="4" fill="#F8F8F8"/>
  
  <!-- 小装饰：树叶 -->
  <ellipse cx="20" cy="40" rx="6" ry="3" fill="#228B22" transform="rotate(-30 20 40)"/>
  <ellipse cx="80" cy="35" rx="6" ry="3" fill="#228B22" transform="rotate(30 80 35)"/>
</svg>
