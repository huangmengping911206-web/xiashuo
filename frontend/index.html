<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>虾说 v2</title>

    <!-- 1. 引入样式 -->
    <link rel="stylesheet" href="/static/css/style.css?v=1774868664">
    <!-- 【新增】引入聊天模块样式 -->
    <link rel="stylesheet" href="/static/css/chat.css?v=1774868664">
    <!-- A股分析模块样式 -->
    <link rel="stylesheet" href="/static/css/stock.css?v=1774868665">
</head>
<body>
    <!-- ===== 主应用容器 ===== -->
    <div id="app" x-data="App()" x-init="init()" x-cloak>

        <!-- ========== 1. 登录页 ========== -->
        <div x-show="page === 'login'" x-transition class="auth-page">
            <div class="ghibli-card auth-card">
                <div class="auth-illustration">
                    <svg class="totoro-icon" viewBox="0 0 200 120">
                        <ellipse cx="100" cy="70" rx="60" ry="45" fill="#90B77D"/>
                        <circle cx="80" cy="50" r="8" fill="#333"/>
                        <circle cx="120" cy="50" r="8" fill="#333"/>
                        <ellipse cx="100" cy="75" rx="25" ry="18" fill="#FFF8E7"/>
                        <path d="M85 70 L100 85 L115 70" stroke="#333" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <h1 class="auth-title">欢迎回来</h1>
                <form @submit.prevent="handleLogin()">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" x-model="loginForm.user_name" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" x-model="loginForm.password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="ghibli-btn ghibli-btn-primary" style="width: 100%" :disabled="loading">
                        <span x-text="loading ? '登录中...' : '登录'"></span>
                    </button>
                </form>
                <div class="auth-footer">
                    还没有账号？<a href="#" @click.prevent="page = 'register'">立即注册</a>
                </div>
            </div>
        </div>

        <!-- ========== 2. 注册页 ========== -->
        <div x-show="page === 'register'" x-transition class="auth-page">
            <div class="ghibli-card auth-card">
                <div class="auth-illustration">
                    <svg class="totoro-icon" viewBox="0 0 200 120">
                        <ellipse cx="100" cy="70" rx="60" ry="45" fill="#87CEEB"/>
                        <circle cx="80" cy="50" r="8" fill="#333"/>
                        <circle cx="120" cy="50" r="8" fill="#333"/>
                        <ellipse cx="100" cy="75" rx="25" ry="18" fill="#FFF8E7"/>
                        <path d="M85 70 L100 85 L115 70" stroke="#333" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <h1 class="auth-title">创建账号</h1>
                <form @submit.prevent="handleRegister()">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" x-model="registerForm.user_name" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" x-model="registerForm.email" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label>手机号（可选）</label>
                        <input type="text" x-model="registerForm.phone" placeholder="请输入手机号">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" x-model="registerForm.password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="ghibli-btn ghibli-btn-primary" style="width: 100%" :disabled="loading">
                        <span x-text="loading ? '注册中...' : '注册'"></span>
                    </button>
                </form>
                <div class="auth-footer">
                    已有账号？<a href="#" @click.prevent="page = 'login'">立即登录</a>
                </div>
            </div>
        </div>

        <!-- ========== 3. 主页（推文列表） ========== -->
        <div x-show="page === 'home'" x-transition class="page-container">
            <header class="page-header">
                <!-- 搜索状态：显示搜索栏 -->
                <template x-if="showSearch">
                    <div class="header-search-inline">
                        <button class="header-btn" @click="showSearch = false; searchKeyword = ''">←</button>
                        <input type="text" class="search-input-inline"
                               x-model="searchKeyword"
                               placeholder="搜索推文..."
                               @keyup.enter="searchTweets()"
                               autofocus>
                        <button class="header-btn" @click="searchTweets()">🔍</button>
                    </div>
                </template>

                <!-- 正常状态：显示标题和搜索按钮 -->
                <template x-if="!showSearch">
                    <div style="display: flex; align-items: center; width: 100%; justify-content: space-between;">
                        <h1 style="flex: 1;">🏡 推文</h1>
                        <button class="header-btn" @click="showSearch = true">🔍</button>
                    </div>
                </template>
            </header>

            <div class="tweet-list-container">
                <!-- 推文卡片 -->
                <template x-for="tweet in tweets" :key="tweet.id">
                    <div class="ghibli-card tweet-card" @click="viewTweetDetail(tweet.id)">
                        <div class="tweet-header">
                            <img class="avatar-circle"
                                 :src="getUserAvatar_by_userid(tweet.creater_id)"
                                 @error="$event.target.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2224%22 fill=%22%2387CEEB%22/%3E%3C/svg%3E'">
                            <div class="tweet-user-info">
                                <!-- 修改点：使用getUserDisplayName获取真实用户名 -->
                                <span class="tweet-user-name" x-text="getUserDisplayName(tweet)"></span>
                                <span class="tweet-time" x-text="formatTime(tweet.created_at)"></span>
                            </div>
                        </div>

                        <div class="tweet-content tweet-md" x-html="renderMarkdown(getTweetDisplayContent(tweet))"></div>
                            
                            <button x-show="isTweetLong(tweet.tweet)"
                                    class="tweet-more-btn"
                                    @click.stop="toggleTweetExpand(tweet.id)">
                                <span x-text="expandedTweets[tweet.id] ? '收起' : '...More'"></span>
                            </button>

                        <!-- 图片展示 -->
                        <div x-show="tweet.image_ids && tweet.image_ids.length > 0"
                             :class="getImageGridClass(tweet.image_ids.length)"
                             class="tweet-images">
                            <template x-for="(imgId, index) in getDisplayImages(tweet.image_ids)" :key="imgId">
                                <img class="tweet-img"
                                     :src="'/api/v2/image/' + imgId"
                                     @click.stop="previewImage(imgId)"
                                     @error="$event.target.style.display='none'">
                            </template>
                        </div>

                        <div class="tweet-actions">
                            <button class="tweet-action-btn" @click.stop="viewTweetDetail(tweet.id)">
                                💬 <span x-text="tweet.comment_count || ''"></span>
                            </button>
                            <button class="tweet-action-btn" disabled>🔄</button>
                            <button class="tweet-action-btn" 
                                    @click.stop="toggleLike(tweet)"
                                    :class="tweet.is_liked ? 'liked' : ''">
                                <span x-text="tweet.is_liked ? '❤️' : '🤍'"></span>
                                <span x-text="tweet.like_count || 0"></span>
                            </button>

                            <!-- 标签显示在最右侧 -->
                            <div x-show="tweet.tags && tweet.tags.length > 0" class="tweet-tags-display">
                                <span>🏷️</span>
                                <span x-text="formatTags(tweet.tags)"></span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- 加载更多 -->
                <div x-show="tweetsLoading" class="load-more">
                    <div class="loading-spinner"></div>
                </div>

                <!-- 空状态 -->
                <div x-show="!tweetsLoading && tweets.length === 0" class="empty-state">
                    <p>还没有推文</p>
                    <p style="font-size: 12px; margin-top: 5px;">快来发布第一条吧！</p>
                </div>
            </div>

            <!-- 发布按钮 -->
            <button class="compose-fab" @click="openCompose()">✏️</button>
        </div>

        <!-- ========== 4. 推文详情页 ========== -->
        <div x-show="page === 'detail'" x-transition class="page-container">
            <header class="page-header">
                <button class="header-btn" @click="goBack()">←</button>
                <h1>推文详情</h1>
                <div style="width: 30px;"></div>
            </header>

            <!-- 推文主体 -->
            <div class="ghibli-card tweet-detail-main">
                <div class="tweet-header">
                    <img class="avatar-circle" 
     :src="getUserAvatar_by_userid(currentTweet.creater_id)" 
     @click="startChatWithUser(currentTweet.creater_id)"
     style="cursor: pointer;"
     title="点击添加私聊">
                    <div class="tweet-user-info">
                        <span class="tweet-user-name" x-text="getUserDisplayName(currentTweet)"></span>
                        <span class="tweet-time" x-text="formatTime(currentTweet.created_at)"></span>
                    </div>
                </div>

                <div class="tweet-detail-content tweet-md" x-html="renderMarkdown(currentTweet.tweet)"></div>

                <!-- 图片展示 -->
                <div x-show="currentTweet.image_ids && currentTweet.image_ids.length > 0"
                     :class="getImageGridClass(currentTweet.image_ids ? currentTweet.image_ids.length : 0)"
                     class="tweet-images tweet-detail-images">
                    <template x-for="imgId in currentTweet.image_ids" :key="imgId">
                        <img class="tweet-img"
                             :src="'/api/v2/image/' + imgId"
                             @click="previewImage(imgId)"
                             @error="$event.target.style.display='none'">
                    </template>
                </div>

                <div x-show="currentTweet.tags" class="tweet-detail-tags">
                    <template x-for="tag in parseTags(currentTweet.tags)" :key="tag">
                        <span class="tweet-tag" x-text="'#' + tag"></span>
                    </template>
                </div>

                <div class="tweet-actions" style="margin-top: 15px;">
                    <button class="tweet-action-btn">💬 <span x-text="comments.length"></span></button>
                    <button class="tweet-action-btn" @click.stop="toggleLike(currentTweet)" :class="currentTweet.is_liked ? 'liked' : ''">
                        <span x-text="currentTweet.is_liked ? '❤️' : '🤍'"></span>
                        <span x-text="currentTweet.like_count || 0"></span>
                    </button>
                    <button x-show="currentTweet.creater_id === user.id"
                            class="tweet-action-btn"
                            style="color: var(--ghibli-coral); margin-left: auto;"
                            @click="showDeleteTweetModal = true">
                        🗑️ 删除
                    </button>
                </div>
            </div>

            <!-- 评论列表 -->
            <div class="ghibli-card comments-section">
                <h3 class="comments-title">💬 评论</h3>

                <template x-for="comment in comments" :key="comment.id">
                    <div class="comment-item">
                        <img class="avatar-circle avatar-small" :src="getUserAvatar(comment.creater_id)">
                        <div class="comment-content">
                            <div class="comment-header">
                                <span class="comment-user-name" x-text="comment.creater_name"></span>
                                <div>
                                    <span class="comment-time" x-text="formatTime(comment.created_at)"></span>
                                    <button x-show="comment.creater_id === user.id"
                                            class="comment-delete-btn"
                                            @click="deleteComment(comment.id)">
                                        删除
                                    </button>
                                </div>
                            </div>
                            <p class="comment-text" x-html="renderMarkdown(comment.content)"></p>
                        </div>
                    </div>
                </template>

                <div x-show="comments.length === 0 && !commentsLoading" class="no-comments">
                    还没有评论，快来抢沙发吧！
                </div>
            </div>

            <!-- 评论输入栏 -->
            <div class="comment-input-bar">
                <input type="text"
                       x-model="newComment"
                       placeholder="写下你的评论..."
                       @keyup.enter="submitComment()">
                <button class="input-send-btn"
                        :class="{ 'active': newComment.trim() }"
                        :disabled="!newComment.trim() || commentSubmitting"
                        @click="submitComment()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ========== 5. 发布推文页 ========== -->
        <div x-show="page === 'compose'" x-transition class="page-container">
            <header class="page-header">
                <button class="header-btn" @click="goBack()">←</button>
                <h1>发布推文</h1>
                <button class="input-send-btn"
                        :class="{ 'active': composeContent.trim() || composeImages.length > 0 }"
                        :disabled="(!composeContent.trim() && composeImages.length === 0) || composeSubmitting"
                        @click="publishTweet()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </header>

            <div class="ghibli-card compose-container">
                <textarea class="compose-textarea"
                          x-model="composeContent"
                          placeholder="写下你的想法...">
                </textarea>
            </div>

            <!-- 图片预览 -->
            <div x-show="composeImages.length > 0 || composeImages.length < 9" class="compose-images">
                <template x-for="(img, index) in composeImages" :key="index">
                    <div class="compose-img-item">
                        <img :src="img.preview">
                        <button class="compose-img-delete" @click="removeImage(index)">✕</button>
                    </div>
                </template>

                <!-- 添加图片按钮 -->
                <div x-show="composeImages.length < 9" class="compose-img-add" @click="selectImage()">
                    <span>+</span>
                </div>
            </div>

            <!-- 工具栏（只保留标签功能） -->
            <div class="compose-toolbar">
                <div class="compose-tools-left">
                    <button class="compose-tool-btn" @click="showTagInput = !showTagInput">🏷️</button>
                    <div x-show="showTagInput" x-transition class="tag-input-row">
                        <template x-for="(tag, index) in composeTags" :key="index">
                            <span class="tag-preview">
                                #<span x-text="tag"></span>
                                <button @click="removeTag(index)" style="background:none; border:none; cursor:pointer; margin-left:2px; font-size:10px;">✕</button>
                            </span>
                        </template>
                        <input type="text"
                               class="tag-input-inline"
                               placeholder="输入标签"
                               x-model="tagInputValue"
                               @keyup.enter="addTag()"
                               @keyup.comma="addTag()">
                    </div>
                </div>
            </div>

            <!-- 隐藏的文件输入 -->
            <input type="file" id="compose-image-input" accept="image/*" multiple style="display: none" @change="handleImageSelect($event)">
        </div>

        <!-- ========== 6. 个人主页 ========== -->
        <div x-show="page === 'profile'" x-transition class="page-container">
            <header class="page-header">
                <h1>我的</h1>
                <button class="logout-btn" style="padding: 5px 10px; margin: 0; border-radius: 12px; font-size: 13px;" @click="handleLogout()">退出</button>
            </header>

            <!-- 个人信息卡片 -->
            <div class="ghibli-card profile-card">
                <div class="profile-avatar-wrapper" @click="uploadAvatar()">
                    <img class="profile-avatar" :src="getAvatarUrl(user.avatar_id)">
                    <div class="profile-avatar-edit">📷</div>
                </div>

                <!-- 名称编辑 -->
                <div x-show="!editingName" class="profile-name" @click="startEditName()">
                    <span x-text="user.user_name || '点击编辑'"></span>
                </div>
                <div x-show="editingName" style="margin: 15px 0 5px;">
                    <input type="text"
                           class="edit-input"
                           x-model="editNameValue"
                           @blur="saveName()"
                           @keyup.enter="saveName()"
                           placeholder="输入名称">
                </div>

                <!-- 签名编辑 -->
                <div x-show="!editingBio" class="profile-bio" @click="startEditBio()">
                    <span x-text="user.whats_up || '点击添加签名'"></span>
                </div>
                <div x-show="editingBio" style="margin-bottom: 20px;">
                    <input type="text"
                           class="edit-input"
                           style="max-width: 250px;"
                           x-model="editBioValue"
                           @blur="saveBio()"
                           @keyup.enter="saveBio()"
                           placeholder="输入签名">
                </div>

                <div class="profile-stats">
                    <div class="stat-item">
                        <span class="stat-number" x-text="totalTweets"></span>
                        <span class="stat-label">推文</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" x-text="totalLikes"></span>
                        <span class="stat-label">点赞</span>
                    </div>
                </div>
            </div>

            <!-- 我的推文 -->
            <div class="my-tweets-section">
                <h3 class="my-tweets-title">📝 我的推文</h3>

                <template x-for="tweet in myTweets" :key="tweet.id">
                    <div class="my-tweet-item" @click="viewTweetDetail(tweet.id)">
                        <span class="my-tweet-content" x-text="truncateText(tweet.tweet, 100)"></span>
                        <span class="my-tweet-time" x-text="formatTime(tweet.created_at)"></span>
                    </div>
                </template>

                <div x-show="myTweets.length === 0" class="no-comments">
                    还没有发布过推文
                </div>
            </div>

            <input type="file" id="avatar-input" accept="image/*" style="display: none" @change="handleAvatarUpload($event)">
        </div>

        <!-- ========== 7. A股分析 - 看板页 ========== -->
        <div x-show="page === 'stock'" x-transition class="page-container">
            <header class="page-header">
                <h1>📈 A股分析</h1>
                <button class="refresh-btn" :class="{ spinning: boardLoading }" @click="refreshBoard()">🔄</button>
            </header>

            <div class="stock-board-container">
                <!-- 加载中 -->
                <div x-show="boardLoading" class="stock-loading">
                    <div class="stock-loading-spinner"></div>
                    <p>加载行情数据...</p>
                </div>

                <template x-if="!boardLoading">
                    <div>
                        <!-- 大盘概览 -->
                        <div class="ghibli-card market-overview">
                            <div class="market-overview-title">📊 大盘概览</div>
                            <div class="market-indices">
                                <template x-for="idx in marketIndices" :key="idx.symbol">
                                    <div class="market-index-item">
                                        <div class="market-index-name" x-text="idx.name"></div>
                                        <div class="market-index-price" x-text="idx.price"></div>
                                        <div class="market-index-change" :class="getChangeClass(idx.change_pct)" x-text="formatChange(idx.change_pct)"></div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- 自选股 -->
                        <div class="watchlist-section">
                            <div class="watchlist-header">
                                <span class="watchlist-title">⭐ 自选股</span>
                                <button class="watchlist-add-btn" @click="showAddStockModal = true">+ 添加</button>
                            </div>

                            <!-- 空状态 -->
                            <div x-show="watchlist.length === 0" class="stock-empty-state">
                                <p>还没有自选股</p>
                                <p style="font-size: 12px; color: var(--text-light);">点击上方 + 添加关注的股票</p>
                            </div>

                            <!-- 自选股列表 -->
                            <template x-for="item in watchlist" :key="item.symbol">
                                <div class="ghibli-card watchlist-item" @click="loadPredictionDetail(item.symbol)">
                                    <div class="watchlist-item-main">
                                        <div class="watchlist-item-info">
                                            <span class="watchlist-item-name" x-text="item.name"></span>
                                            <span class="watchlist-item-code" x-text="item.symbol"></span>
                                        </div>
                                        <div class="watchlist-item-price">
                                            <span class="watchlist-item-current" :class="getChangeClass(item.change_pct)" x-text="item.price"></span>
                                            <span class="watchlist-item-change" :class="getChangeClass(item.change_pct)" x-text="formatChange(item.change_pct)"></span>
                                        </div>
                                    </div>
                                    <!-- 预判信息 -->
                                    <div x-show="item.prediction" class="watchlist-item-prediction">
                                        <span x-text="getPredictionEmoji(item.prediction.prediction)"></span>
                                        <span class="prediction-label" :class="getPredictionClass(item.prediction.prediction)" x-text="item.prediction.prediction"></span>
                                        <span class="prediction-magnitude" x-text="formatMagnitude(item.prediction.magnitude_min, item.prediction.magnitude_max)"></span>
                                        <span class="prediction-score" x-text="formatScore(item.prediction.score)"></span>
                                        <span class="prediction-reason-btn">📋</span>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- 准确率统计 -->
                        <div x-show="stats && stats.total_count > 0" class="ghibli-card accuracy-card">
                            <div class="accuracy-title">🎯 预判准确率 <span style="font-size: 12px; color: var(--text-light);">近30天</span></div>
                            <div class="accuracy-main">
                                <div class="accuracy-rate">
                                    <span class="accuracy-rate-value" x-text="(stats.accuracy_rate * 100).toFixed(0) + '%'"></span>
                                    <span class="accuracy-rate-label">总命中率</span>
                                </div>
                                <div class="accuracy-bar">
                                    <div class="accuracy-bar-fill" :style="'width: ' + (stats.accuracy_rate * 100) + '%'"></div>
                                </div>
                            </div>
                            <div class="accuracy-detail">
                                <div class="accuracy-item">
                                    <span>📈 看涨</span>
                                    <span x-text="stats.bullish_count > 0 ? ((stats.bullish_correct / stats.bullish_count) * 100).toFixed(0) + '%' : '--'"></span>
                                </div>
                                <div class="accuracy-item">
                                    <span>📉 看跌</span>
                                    <span x-text="stats.bearish_count > 0 ? ((stats.bearish_correct / stats.bearish_count) * 100).toFixed(0) + '%' : '--'"></span>
                                </div>
                                <div class="accuracy-item">
                                    <span>➡️ 中性</span>
                                    <span x-text="stats.neutral_count > 0 ? ((stats.neutral_correct / stats.neutral_count) * 100).toFixed(0) + '%' : '--'"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ========== 8. A股分析 - 预判详情页 ========== -->
        <div x-show="page === 'stock-detail'" x-transition class="page-container">
            <header class="page-header">
                <button class="back-btn" @click="goBackFromStock()">← 返回</button>
                <h1 x-text="predictionDetail ? predictionDetail.name + ' 预判' : '加载中...'"></h1>
            </header>

            <div class="stock-board-container">
                <template x-if="predictionDetail">
                    <div>
                        <!-- 预判概要 -->
                        <div class="ghibli-card prediction-summary">
                            <div class="prediction-summary-header">
                                <span class="prediction-summary-direction" :class="getPredictionClass(predictionDetail.prediction)" x-text="getPredictionEmoji(predictionDetail.prediction) + ' ' + predictionDetail.prediction"></span>
                                <span class="prediction-summary-magnitude" x-text="formatMagnitude(predictionDetail.magnitude_min, predictionDetail.magnitude_max)"></span>
                                <span class="prediction-summary-score" x-text="formatScore(predictionDetail.score)"></span>
                            </div>
                            <div class="prediction-summary-meta">
                                <span>分析日期：<span x-text="predictionDetail.analysis_date"></span></span>
                                <span x-show="predictionDetail.entry_price">分析时价格：<span x-text="predictionDetail.entry_price"></span></span>
                            </div>
                            <div x-show="predictionDetail.reasons" class="prediction-summary-reasons" x-text="predictionDetail.reasons"></div>
                        </div>

                        <!-- 六维评估 -->
                        <div class="ghibli-card">
                            <div class="dimensions-title">六维评估</div>
                            <template x-for="dim in [
                                { key: 'fundamental', label: '基本面', icon: '💼' },
                                { key: 'industry', label: '行业面', icon: '🏭' },
                                { key: 'news', label: '消息面', icon: '📰' },
                                { key: 'technical', label: '技术面', icon: '📊' },
                                { key: 'capital', label: '资金面', icon: '💰' },
                                { key: 'risk', label: '风险面', icon: '⚠️' }
                            ]" :key="dim.key">
                                <div class="dimension-item" @click="toggleDimension(dim.key)">
                                    <div class="dimension-header">
                                        <span class="dimension-label"><span x-text="dim.icon"></span> <span x-text="dim.label"></span></span>
                                        <span class="dimension-toggle" x-text="expandedDimensions[dim.key] ? '▼' : '▶'"></span>
                                    </div>
                                    <div x-show="expandedDimensions[dim.key]" x-transition class="dimension-content" x-text="predictionDetail[dim.key] || '暂无数据'"></div>
                                </div>
                            </template>
                        </div>

                        <!-- 历史准确率 -->
                        <div x-show="predictionStats && predictionStats.total_count > 0" class="ghibli-card accuracy-card">
                            <div class="accuracy-title">🎯 该股预判准确率</div>
                            <div class="accuracy-main">
                                <div class="accuracy-rate">
                                    <span class="accuracy-rate-value" x-text="(predictionStats.accuracy_rate * 100).toFixed(0) + '%'"></span>
                                    <span class="accuracy-rate-label">总命中率</span>
                                </div>
                            </div>
                        </div>

                        <!-- 历史预判 -->
                        <div x-show="predictionHistory.length > 1" class="ghibli-card">
                            <div class="dimensions-title">历史预判</div>
                            <template x-for="h in predictionHistory.slice(1)" :key="h.id">
                                <div class="history-item">
                                    <span class="history-date" x-text="h.analysis_date"></span>
                                    <span :class="getPredictionClass(h.prediction)" x-text="getPredictionEmoji(h.prediction) + ' ' + h.prediction"></span>
                                    <span class="history-score" x-text="formatScore(h.score)"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ========== 添加自选股弹窗 ========== -->
        <div x-show="showAddStockModal" class="modal-overlay" @click.self="showAddStockModal = false">
            <div class="modal-content" style="max-height: 70vh; overflow-y: auto;">
                <h3 class="modal-title">添加自选股</h3>
                <div style="margin-bottom: 10px; font-size: 12px; color: var(--text-light);">输入股票代码和名称（上交所 .SS，深交所 .SZ）</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <input type="text" class="search-input" placeholder="股票代码，如 600519.SS"
                           x-model="addStockSymbol">
                    <input type="text" class="search-input" placeholder="股票名称，如 贵州茅台"
                           x-model="addStockName">
                    <button class="watchlist-add-btn" @click="manualAddToWatchlist()" :disabled="!addStockSymbol.trim() || !addStockName.trim() || addStockLoading" style="width: 100%; padding: 10px;">
                        <span x-show="!addStockLoading">添加到自选</span>
                        <span x-show="addStockLoading">添加中...</span>
                    </button>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn modal-btn-cancel" @click="showAddStockModal = false">关闭</button>
                </div>
            </div>
        </div>

        <!-- ========== 底部导航栏 ========== -->

        <!-- 底部导航栏 -->
        <div x-show="['home', 'profile', 'chat', 'stock', 'stock-detail'].includes(page)" class="bottom-nav">

            <!-- 推文页 -->
            <button class="nav-item" :class="{ active: page === 'home' }" @click="navigateToHome()">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">推文</span>
            </button>

            <!-- A股分析 -->
            <button class="nav-item" :class="{ active: ['stock', 'stock-detail'].includes(page) }" @click="navigateToStock()">
                <span class="nav-icon">📈</span>
                <span class="nav-label">A股</span>
            </button>

            <!-- 聊天页 -->
            <button class="nav-item" :class="{ active: page === 'chat' }" @click="navigateToChat()" style="position: relative;">
                <span class="nav-icon">💬</span>
                <span class="nav-label">聊天</span>
                <!-- 未读消息数小红点 -->
                <span x-show="totalUnread > 0"
                      class="nav-badge"
                      x-text="totalUnread > 99 ? '99+' : totalUnread">
                </span>
            </button>

            <!-- 我的页 -->
            <button class="nav-item" :class="{ active: page === 'profile' }" @click="navigateToProfile()">
                <span class="nav-icon">👤</span>
                <span class="nav-label">我的</span>
            </button>
        </div>


        <!-- ========== Toast 提示 ========== -->
        <div x-show="toast.show"
             x-transition
             class="toast"
             :class="'toast-' + toast.type"
             x-text="toast.message">
        </div>

        <!-- ========== 删除确认弹窗 ========== -->
        <div x-show="showDeleteTweetModal" class="modal-overlay" @click.self="showDeleteTweetModal = false">
            <div class="modal-content">
                <h3 class="modal-title">确认删除</h3>
                <p class="modal-text">确定要删除这条推文吗？删除后无法恢复。</p>
                <div class="modal-actions">
                    <button class="modal-btn modal-btn-cancel" @click="showDeleteTweetModal = false">取消</button>
                    <button class="modal-btn modal-btn-confirm" @click="deleteCurrentTweet()">删除</button>
                </div>
            </div>
        </div>

        <!-- 图片预览弹窗 -->
        <div x-show="previewImageId" class="image-preview-modal" @click="previewImageId = null">
            <button class="image-preview-close" @click="previewImageId = null">✕</button>
            <img :src="'/api/v2/image/' + previewImageId" @click.stop>
        </div>

                <!-- ==================== 聊天模块（从模板引入） ==================== -->
        <div x-html="ChatTemplates.conversationList"></div>
        <div x-html="ChatTemplates.chatDetail"></div>
        <div x-html="ChatTemplates.createGroupModal"></div>
        <div x-html="ChatTemplates.addMemberModal"></div>
        <div x-html="ChatTemplates.editGroupNameModal"></div>


        <!-- ==================== 全局组件 ==================== -->

        <!-- Toast 提示 -->
        <div x-show="toast.show"
             x-transition
             class="fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg z-50"
             :class="{
                 'bg-green-500 text-white': toast.type === 'success',
                 'bg-red-500 text-white': toast.type === 'error',
                 'bg-blue-500 text-white': toast.type === 'info'
             }">
            <span x-text="toast.message"></span>
        </div>

    </div>
